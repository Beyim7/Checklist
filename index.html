<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F8F7F3">
<title>Checklist</title>
<style>
:root{--bg:#F8F7F3;--card:#fff;--tx:#252525;--tx2:#858585;--ac:#789477;--bd:#ece9e2;--sage:#DDE8D8;--lav:#E8E1F4;--peach:#F6E1D5;--sky:#D9E7F2;--rose:#F4DADF;--sh:0 1px 3px rgba(0,0,0,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
:root:not([data-theme=light]){}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1b1d;--card:#252528;--tx:#ececec;--tx2:#9a9a9a;--ac:#9bb99a;--bd:#34343a;--sage:#2f3d2f;--lav:#38334a;--peach:#4a3a30;--sky:#2c3a47;--rose:#4a2f36;--sh:none}}
:root[data-theme=dark]{--bg:#1b1b1d;--card:#252528;--tx:#ececec;--tx2:#9a9a9a;--ac:#9bb99a;--bd:#34343a;--sage:#2f3d2f;--lav:#38334a;--peach:#4a3a30;--sky:#2c3a47;--rose:#4a2f36;--sh:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:'DM Sans',Inter,system-ui,sans-serif;overflow-x:hidden}
#app{max-width:640px;margin:0 auto;height:100%;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:20px 18px 24px;scroll-behavior:smooth}
h1{font-size:28px;margin:4px 0 2px;letter-spacing:-.5px}h2{font-size:17px;margin:26px 0 10px}
.sub{color:var(--tx2);font-size:14px;margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;min-height:44px;min-width:44px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;box-shadow:var(--sh);padding:16px}
.btn{background:var(--ac);color:#fff;border-radius:14px;padding:0 18px;font-weight:600}
.btn.ghost{background:var(--sage);color:var(--tx)}.btn.danger{background:#c9645a}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lc{border-radius:18px;padding:14px;text-align:left;min-height:110px;display:flex;flex-direction:column;justify-content:space-between;color:var(--tx)}
.lc b{font-size:15px}.lc small{color:var(--tx2)}
.bar{height:6px;background:rgba(120,120,120,.18);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);border-radius:9px;transition:width .4s}
.task{display:flex;align-items:flex-start;gap:6px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:2px 8px 2px 2px;margin-bottom:8px}
.task.drag{opacity:.4}
.ck{width:44px;height:44px;display:grid;place-items:center;flex:none}
.ck span{width:24px;height:24px;border-radius:50%;border:2px solid var(--ac);display:grid;place-items:center;transition:.2s}
.ck svg{width:14px;height:14px;stroke:#fff;stroke-width:3;fill:none;stroke-dasharray:20;stroke-dashoffset:20;transition:.3s}
.done .ck span{background:var(--ac);transform:scale(1.08)}.done .ck svg{stroke-dashoffset:0}
.tt{flex:1;padding:10px 0;text-align:left;min-height:44px;overflow-wrap:anywhere;transition:.3s}
.done .tt{color:var(--tx2);text-decoration:line-through;opacity:.7}
.meta{font-size:12px;color:var(--tx2);display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.pri{display:inline-block;width:8px;height:8px;border-radius:50%}
nav{display:flex;background:var(--card);border-top:1px solid var(--bd);padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--tx2);gap:2px}
nav button.on{color:var(--ac);font-weight:600}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.addbar{display:flex;gap:8px;padding:10px 18px;background:var(--bg);border-top:1px solid var(--bd)}
input,select,textarea{font:inherit;font-size:16px;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:11px 12px;width:100%;min-height:44px}
textarea{resize:vertical;min-height:70px}
label{font-size:12px;color:var(--tx2);display:block;margin:12px 0 4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:0 14px;border-radius:99px;background:var(--card);border:1px solid var(--bd);min-height:36px;min-width:0;font-size:13px}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.sw{width:36px;height:36px;border-radius:50%;border:2px solid transparent;min-width:0;min-height:0}.sw.on{border-color:var(--ac)}
#sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;justify-content:center;z-index:20}
#sheetbg.on{display:flex}
#sheet{background:var(--bg);width:100%;max-width:640px;max-height:92dvh;overflow-y:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:0 16px;border-radius:99px;display:none;align-items:center;gap:12px;z-index:30;font-size:14px;max-width:92%}
#toast.on{display:flex;animation:up .25s}#toast button{color:var(--sage);font-weight:700;min-height:40px}
.empty{text-align:center;color:var(--tx2);padding:34px 10px}.empty big{font-size:36px;display:block;margin-bottom:6px}
.win{text-align:center;padding:18px;border-radius:18px;background:var(--sage);margin:12px 0;animation:pop .5s}
@keyframes pop{0%{transform:scale(.9);opacity:0}60%{transform:scale(1.04)}}
.sub-t{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.sub-t input[type=text]{flex:1}
.fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;background:var(--ac);color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.2);display:grid;place-items:center;z-index:10}
</style></head><body>
<div id="app"><main id="main"></main><div id="bar"></div>
<nav id="nav"></nav></div>
<div id="sheetbg"><div id="sheet"></div></div><div id="toast"></div>
<script>
const COL={sage:'--sage',lav:'--lav',peach:'--peach',sky:'--sky',rose:'--rose'};
const IC={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',today:'<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/>',lists:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',done:'<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',set:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>',plus:'<path d="M12 5v14M5 12h14"/>',back:'<path d="M15 5l-7 7 7 7"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24">${IC[n]}</svg>`;
const TPL={
 'Blank Checklist':['✨','sage',[]],
 'Study Day':['📚','lav',["Review yesterday's lecture","Attend today's classes","Complete assignments","Practice C++ programming","Revise important concepts","Solve past-paper questions","Prepare notes","Review today's learning"]],
 'Morning Routine':['🌅','peach',["Make bed","Drink water","Stretch","Healthy breakfast","Plan the day"]],
 'Night Routine':['🌙','lav',["Tidy up","Pack bag for tomorrow","Skincare","Read 10 pages","Lights out on time"]],
 'Weekly Goals':['🎯','sage',["Pick 3 main goals","Review last week","Plan study sessions","Plan something fun"]],
 'Workout Routine':['🏋️','sky',["Warm up","Main set","Cardio","Cool down & stretch"]],
 'Self-Care':['🧖','rose',["Drink enough water","Move your body","Time outside","Journal","Rest"]],
 'Shopping List':['🛒','peach',["Fruits & veg","Staples","Household items"]]};
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={lists:[],theme:'auto'};
function load(){try{const r=localStorage.getItem('checklist.v1');if(r)S=JSON.parse(r)}catch(e){}
 if(!S.lists.length&&!localStorage.getItem('checklist.seeded')){S.lists.push(mk('Study Day'));try{localStorage.setItem('checklist.seeded','1')}catch(e){}save()}}
function save(){try{localStorage.setItem('checklist.v1',JSON.stringify(S))}catch(e){toast('Storage unavailable — changes may not persist')}}
function mk(tn,name){const[t,c,ts]=TPL[tn]||TPL['Blank Checklist'];return{id:uid(),name:name||(tn=='Blank Checklist'?'New List':tn),emoji:t,color:c,tasks:ts.map(x=>nt(x))}}
const nt=t=>({id:uid(),t,done:false,notes:'',due:'',pri:'medium',rem:'',subs:[],rep:'none',days:[],doneOn:'',hist:[]});
function dueRep(t,d){if(t.rep=='daily')return true;if(t.rep=='days')return t.days.includes(d.getDay());return false}
function rollover(){const td=today();S.lists.forEach(l=>l.tasks.forEach(t=>{if(t.rep!='none'&&t.done&&t.doneOn&&t.doneOn<td){t.done=false;t.subs.forEach(s=>s.done=false);}}));save()}
let ui={v:'home',lid:null,f:'all'};
const L=id=>S.lists.find(l=>l.id==id);
const allT=()=>S.lists.flatMap(l=>l.tasks.map(t=>({t,l})));
const isToday=(t)=>t.due==today()||dueRep(t,new Date());
const pc=l=>{const n=l.tasks.length,d=l.tasks.filter(t=>t.done).length;return[d,n,n?Math.round(d/n*100):0]};
function ring(p,sz=76){const r=sz/2-7,c=2*Math.PI*r;return`<svg width="${sz}" height="${sz}"><circle cx="${sz/2}" cy="${sz/2}" r="${r}" stroke="rgba(120,120,120,.2)" stroke-width="7" fill="none"/><circle cx="${sz/2}" cy="${sz/2}" r="${r}" stroke="var(--ac)" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p/100)}" transform="rotate(-90 ${sz/2} ${sz/2})" style="transition:.5s"/><text x="50%" y="53%" text-anchor="middle" dominant-baseline="middle" font-size="${sz/5}" font-weight="700" fill="var(--tx)">${p}%</text></svg>`}
function taskHTML(t,l,drag){const pcol={high:'#d9776b',medium:'#e0b45a',low:'#8fb08d'}[t.pri];const sd=t.subs.filter(s=>s.done).length;
 return`<div class="task ${t.done?'done':''}" ${drag?'draggable="true"':''} data-tid="${t.id}" data-lid="${l.id}"><button class="ck" data-a="tog" aria-label="${t.done?'Uncheck':'Check'} ${esc(t.t)}"><span><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></span></button><button class="tt" data-a="edit"><div>${esc(t.t)}</div><div class="meta"><span><i class="pri" style="background:${pcol}"></i> ${t.pri}</span>${t.due?`<span>📅 ${t.due}</span>`:''}${t.rem?`<span>⏰ ${t.rem}</span>`:''}${t.rep!='none'?'<span>🔁 repeats</span>':''}${t.subs.length?`<span>☑ ${sd}/${t.subs.length}</span>`:''}${ui.v!='list'?`<span>${l.emoji} ${esc(l.name)}</span>`:''}</div>${t.notes?`<div class="meta">${esc(t.notes.slice(0,60))}</div>`:''}</button></div>`}
const greet=()=>{const h=new Date().getHours();return h<12?'Good morning ☀️':h<18?'Good afternoon 🌤️':'Good evening 🌙'};
function listCard(l){const[d,n,p]=pc(l);return`<button class="lc" style="background:var(${COL[l.color]})" data-a="open" data-lid="${l.id}"><div style="font-size:26px">${esc(l.emoji)}</div><div><b>${esc(l.name)}</b><div class="bar" style="margin:6px 0"><i style="width:${p}%"></i></div><small>${d}/${n} done</small></div></button>`}
function vHome(){const a=allT().filter(x=>isToday(x.t)),d=a.filter(x=>x.t.done).length,p=a.length?Math.round(d/a.length*100):0;
 return`<p class="sub">${new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})}</p><h1>${greet()}</h1><p class="sub">Small steps make a beautiful difference.</p>
 <div class="card row" style="margin-top:18px">${ring(p)}<div class="sp"><b>${a.length?`${d} of ${a.length} done today`:'Nothing due today'}</b><p class="sub">${a.length&&d==a.length?"You're all caught up!":a.length?'Keep going, you\'re doing great.':'A fresh start. Add your first task.'}</p></div></div>
 <button class="btn" style="width:100%;margin-top:14px" data-a="newlist">+ New List</button>
 <h2>My Lists</h2>${S.lists.length?`<div class="grid">${S.lists.map(listCard).join('')}</div>`:'<div class="empty"><big>🌱</big>Nothing on your list yet.</div>'}
 <h2>Today's Tasks</h2>${a.length?a.map(x=>taskHTML(x.t,x.l)).join(''):'<div class="empty"><big>🍃</big>Nothing due today.</div>'}`}
function vToday(){const td=today();const a=allT().filter(x=>isToday(x.t));const od=allT().filter(x=>x.t.due&&x.t.due<td&&!x.t.done);const up=allT().filter(x=>x.t.due>td&&!x.t.done).sort((a,b)=>a.t.due>b.t.due?1:-1);
 return`<h1>Today</h1><p class="sub">${a.filter(x=>x.t.done).length} of ${a.length} done</p>
 ${od.length?`<h2>Overdue</h2>${od.map(x=>taskHTML(x.t,x.l)).join('')}`:''}
 <h2>Due today</h2>${a.length?a.map(x=>taskHTML(x.t,x.l)).join(''):'<div class="empty"><big>✨</big>You\'re all caught up!</div>'}
 ${up.length?`<h2>Upcoming</h2>${up.map(x=>taskHTML(x.t,x.l)).join('')}`:''}`}
function vLists(){return`<div class="row"><h1 class="sp">My Lists</h1><button class="btn" data-a="newlist">+ New</button></div>${S.lists.length?`<div class="grid" style="margin-top:14px">${S.lists.map(listCard).join('')}</div>`:'<div class="empty"><big>🌱</big>Nothing on your list yet.<br>Tap + New to start.</div>'}`}
function vDone(){const a=allT().filter(x=>x.t.done);const h=allT().flatMap(x=>x.t.hist.map(d=>({d,t:x.t,l:x.l}))).sort((a,b)=>a.d<b.d?1:-1).slice(0,40);
 return`<h1>Completed</h1><p class="sub">${a.length} finished · tap to review or restore</p><h2>Finished tasks</h2>${a.length?a.map(x=>taskHTML(x.t,x.l)).join(''):'<div class="empty"><big>🌤️</big>Nothing completed yet.</div>'}
 ${h.length?`<h2>Routine history</h2>${h.map(x=>`<div class="card" style="padding:10px 14px;margin-bottom:6px;font-size:14px">✅ ${esc(x.t.t)} <span class="sub">· ${x.d}</span></div>`).join('')}`:''}`}
function vSet(){return`<h1>Settings</h1><h2>Appearance</h2><div class="chips">${['auto','light','dark'].map(m=>`<button class="chip ${S.theme==m?'on':''}" data-a="theme" data-m="${m}">${m[0].toUpperCase()+m.slice(1)}</button>`).join('')}</div>
 <h2>Backup</h2><div class="row"><button class="btn ghost sp" data-a="export">Export JSON</button><button class="btn ghost sp" data-a="import">Import JSON</button></div><input type="file" id="imp" accept=".json" hidden>
 <h2>Data</h2><button class="btn danger" data-a="reset">Erase all data</button><p class="sub" style="margin-top:14px">Everything is stored privately on this device. No account needed.</p>`}
function vList(){const l=L(ui.lid);if(!l){ui.v='lists';return vLists()}const[d,n,p]=pc(l);
 const ts=l.tasks.filter(t=>ui.f=='all'||(ui.f=='active'?!t.done:t.done));
 return`<div class="row"><button data-a="back" aria-label="Back">${ic('back')}</button><div class="sp"></div><button data-a="editlist" aria-label="List options">${ic('more')}</button></div>
 <div class="card" style="background:var(${COL[l.color]});margin-top:6px"><div class="row"><span style="font-size:30px">${esc(l.emoji)}</span><div class="sp"><b style="font-size:20px">${esc(l.name)}</b><div class="sub">${n} task${n==1?'':'s'} · ${d} done</div></div></div><div class="bar" style="margin-top:12px"><i style="width:${p}%"></i></div></div>
 <div class="chips" style="margin:14px 0">${['all','active','completed'].map(f=>`<button class="chip ${ui.f==f?'on':''}" data-a="filter" data-f="${f}">${f[0].toUpperCase()+f.slice(1)}</button>`).join('')}</div>
 ${n&&d==n?'<div class="win">🎉 You completed everything. Well done!</div>':''}
 ${ts.length?ts.map(t=>taskHTML(t,l,ui.f=='all')).join(''):`<div class="empty"><big>${n?'🍃':'🌱'}</big>${n?(ui.f=='active'?"You're all caught up!":'Nothing here yet.'):'A fresh start. Add your first task.'}</div>`}`}
function render(){const m=$('#main');const keep=m.scrollTop;
 m.innerHTML={home:vHome,today:vToday,lists:vLists,done:vDone,set:vSet,list:vList}[ui.v]();
 m.scrollTop=keep;
 $('#bar').innerHTML=ui.v=='list'?`<form class="addbar" id="addf"><input id="addin" placeholder="Add a task…" enterkeyhint="done" autocomplete="off" aria-label="New task"><button class="btn" aria-label="Add task">${ic('plus')}</button></form>`:'';
 $('#nav').innerHTML=[['home','Home'],['today','Today'],['lists','Lists'],['done','Completed'],['set','Settings']].map(([k,n])=>`<button class="${(ui.v==k||(ui.v=='list'&&k=='lists'))?'on':''}" data-a="nav" data-v="${k}" aria-label="${n}">${ic(k)}${n}</button>`).join('');
 const th=S.theme;document.documentElement.dataset.theme=th=='auto'?'':th;
 const bgc=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();document.querySelector('meta[name=theme-color]').content=bgc}
function $(s){return document.querySelector(s)}
let tt;function toast(m,undo){const t=$('#toast');t.innerHTML=esc(m)+(undo?'<button id="undo">Undo</button>':'');t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),4000);if(undo)$('#undo').onclick=()=>{undo();t.classList.remove('on')}}
function sheet(h){$('#sheet').innerHTML=h;$('#sheetbg').classList.add('on')}
function closeSheet(){$('#sheetbg').classList.remove('on')}
$('#sheetbg').addEventListener('click',e=>{if(e.target.id=='sheetbg')closeSheet()});
let draft=null;
function listSheet(l){draft=l?{...l}:{name:'',emoji:'✨',color:'sage',tpl:'Blank Checklist'};
 sheet(`<h1 style="font-size:22px">${l?'Edit list':'New list'}</h1>
 ${l?'':`<label>Start from</label><div class="chips">${Object.keys(TPL).map(k=>`<button class="chip ${k==draft.tpl?'on':''}" data-a="tpl" data-k="${k}">${TPL[k][0]} ${k}</button>`).join('')}</div>`}
 <label>Name</label><input id="ln" value="${esc(draft.name)}" placeholder="e.g. Study Routine" maxlength="40">
 <label>Emoji</label><input id="le" value="${esc(draft.emoji)}" maxlength="4" style="width:90px;font-size:22px;text-align:center">
 <label>Colour</label><div class="chips">${Object.keys(COL).map(c=>`<button class="sw ${c==draft.color?'on':''}" data-a="col" data-c="${c}" style="background:var(${COL[c]})" aria-label="${c}"></button>`).join('')}</div>
 <div class="row" style="margin-top:20px"><button class="btn ghost sp" data-a="close">Cancel</button><button class="btn sp" data-a="savelist" data-id="${l?l.id:''}">${l?'Save':'Create'}</button></div>
 ${l?`<div class="row" style="margin-top:10px"><button class="btn ghost sp" data-a="duplist">Duplicate</button><button class="btn danger sp" data-a="dellist">Delete list</button></div>`:''}`)}
function taskSheet(lid,tid){const l=L(lid),t=l.tasks.find(x=>x.id==tid);draft={lid,tid,subs:t.subs.map(s=>({...s})),rep:t.rep,days:[...t.days]};
 const dn=['S','M','T','W','T','F','S'];
 sheet(`<h1 style="font-size:22px">Edit task</h1><label>Task</label><input id="tn" value="${esc(t.t)}">
 <label>Notes</label><textarea id="tno">${esc(t.notes)}</textarea>
 <div class="row"><div class="sp"><label>Due date</label><input type="date" id="td" value="${t.due}"></div><div class="sp"><label>Reminder</label><input type="time" id="tr" value="${t.rem}"></div></div>
 <label>Priority</label><select id="tp">${['low','medium','high'].map(p=>`<option ${t.pri==p?'selected':''}>${p}</option>`).join('')}</select>
 <label>Repeat</label><div class="chips">${[['none','Never'],['daily','Daily'],['days','Selected days']].map(([k,n])=>`<button class="chip ${draft.rep==k?'on':''}" data-a="rep" data-k="${k}">${n}</button>`).join('')}</div>
 <div class="chips" id="dayc" style="margin-top:8px;${draft.rep=='days'?'':'display:none'}">${dn.map((n,i)=>`<button class="chip ${draft.days.includes(i)?'on':''}" data-a="day" data-i="${i}" style="min-width:40px;padding:0">${n}</button>`).join('')}</div>
 <label>Move to list</label><select id="tl">${S.lists.map(x=>`<option value="${x.id}" ${x.id==lid?'selected':''}>${esc(x.emoji+' '+x.name)}</option>`).join('')}</select>
 <label>Subtasks</label><div id="subs">${subsHTML()}</div><button class="btn ghost" data-a="addsub" style="width:100%">+ Add subtask</button>
 <div class="row" style="margin-top:20px"><button class="btn ghost" data-a="mv" data-d="-1" aria-label="Move up">↑</button><button class="btn ghost" data-a="mv" data-d="1" aria-label="Move down">↓</button><button class="btn danger sp" data-a="deltask">Delete</button><button class="btn sp" data-a="savetask">Save</button></div>`)}
const subsHTML=()=>draft.subs.map((s,i)=>`<div class="sub-t"><input type="checkbox" ${s.done?'checked':''} data-a="subck" data-i="${i}" style="width:24px;min-height:24px"><input type="text" value="${esc(s.t)}" data-sub="${i}" placeholder="Subtask"><button data-a="subdel" data-i="${i}" aria-label="Remove subtask">✕</button></div>`).join('');
function syncSubs(){document.querySelectorAll('[data-sub]').forEach(e=>draft.subs[+e.dataset.sub].t=e.value)}
function doneToggle(l,t){t.done=!t.done;if(t.done){t.doneOn=today();if(!t.hist.includes(today()))t.hist.push(today());}else{t.hist=t.hist.filter(d=>d!=today());t.doneOn=''}save();render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;const tk=b.closest('[data-tid]');
 const M={
 nav(){ui.v=b.dataset.v;render()},
 open(){ui.v='list';ui.lid=b.dataset.lid;ui.f='all';render()},
 back(){ui.v='lists';render()},
 filter(){ui.f=b.dataset.f;render()},
 tog(){const l=L(tk.dataset.lid);doneToggle(l,l.tasks.find(t=>t.id==tk.dataset.tid))},
 edit(){taskSheet(tk.dataset.lid,tk.dataset.tid)},
 newlist(){listSheet()},editlist(){listSheet(L(ui.lid))},close:closeSheet,
 tpl(){draft.tpl=b.dataset.k;const t=TPL[draft.tpl];draft.emoji=t[0];draft.color=t[1];draft.name=$('#ln').value||(draft.tpl=='Blank Checklist'?'':draft.tpl);listSheet2()},
 col(){draft.color=b.dataset.c;draft.name=$('#ln').value;draft.emoji=$('#le').value;listSheet2()},
 savelist(){const n=$('#ln').value.trim();if(!n){toast('Please give your list a name');$('#ln').focus();return}const em=$('#le').value.trim()||'✨';
  if(b.dataset.id){const l=L(b.dataset.id);Object.assign(l,{name:n,emoji:em,color:draft.color});toast('List updated')}
  else{const l=mk(draft.tpl,n);l.emoji=em;l.color=draft.color;S.lists.push(l);toast('List created');ui.v='list';ui.lid=l.id;ui.f='all'}
  save();closeSheet();render()},
 duplist(){const l=L(ui.lid),c=JSON.parse(JSON.stringify(l));c.id=uid();c.name+=' (copy)';c.tasks.forEach(t=>{t.id=uid();t.done=false;t.hist=[];t.doneOn=''});S.lists.push(c);save();closeSheet();toast('List duplicated');render()},
 dellist(){if(!confirm('Permanently delete this list and all its tasks?'))return;const l=L(ui.lid),i=S.lists.indexOf(l);S.lists.splice(i,1);save();closeSheet();ui.v='lists';render();toast('List deleted',()=>{S.lists.splice(i,0,l);save();render()})},
 rep(){draft.rep=b.dataset.k;syncSubs();keepTask()},
 day(){const i=+b.dataset.i;draft.days=draft.days.includes(i)?draft.days.filter(x=>x!=i):[...draft.days,i];b.classList.toggle('on')},
 addsub(){syncSubs();draft.subs.push({t:'',done:false});$('#subs').innerHTML=subsHTML();[...document.querySelectorAll('[data-sub]')].pop().focus()},
 subdel(){syncSubs();draft.subs.splice(+b.dataset.i,1);$('#subs').innerHTML=subsHTML()},
 subck(){draft.subs[+b.dataset.i].done=b.checked},
 mv(){const l=L(draft.lid),i=l.tasks.findIndex(t=>t.id==draft.tid),j=i+ +b.dataset.d;if(j<0||j>=l.tasks.length)return;[l.tasks[i],l.tasks[j]]=[l.tasks[j],l.tasks[i]];save();render();toast('Moved')},
 deltask(){const l=L(draft.lid),i=l.tasks.findIndex(t=>t.id==draft.tid),t=l.tasks[i];l.tasks.splice(i,1);save();closeSheet();render();toast('Task deleted',()=>{l.tasks.splice(i,0,t);save();render()})},
 savetask(){const n=$('#tn').value.trim();if(!n){toast('Task name can\'t be empty');return}syncSubs();const l=L(draft.lid),t=l.tasks.find(x=>x.id==draft.tid);
  Object.assign(t,{t:n,notes:$('#tno').value,due:$('#td').value,rem:$('#tr').value,pri:$('#tp').value,rep:draft.rep,days:draft.days,subs:draft.subs.filter(s=>s.t.trim())});
  const to=$('#tl').value;if(to!=l.id){l.tasks.splice(l.tasks.indexOf(t),1);L(to).tasks.push(t);toast('Moved to '+L(to).name)}else toast('Task saved');save();closeSheet();render()},
 theme(){S.theme=b.dataset.m;save();render()},
 export(){const u=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));const x=document.createElement('a');x.href=u;x.download='checklist-backup-'+today()+'.json';x.click();toast('Backup downloaded')},
 import(){$('#imp').click()},
 reset(){if(confirm('Erase ALL lists and tasks? This cannot be undone.')){S={lists:[],theme:S.theme};save();render();toast('All data erased')}}};
 M[a]&&M[a]()});
function listSheet2(){const d=draft;const id=$('#sheet').querySelector('[data-a=savelist]').dataset.id;const l=id?{...d,id}:null;const keep=d;if(id){listSheet(L(id));draft=keep;}else{listSheet();draft=keep}$('#ln').value=d.name;$('#le').value=d.emoji;
 document.querySelectorAll('.sw').forEach(s=>s.classList.toggle('on',s.dataset.c==d.color));document.querySelectorAll('[data-a=tpl]').forEach(s=>s.classList.toggle('on',s.dataset.k==d.tpl))}
function keepTask(){const f={n:$('#tn').value,no:$('#tno').value,d:$('#td').value,r:$('#tr').value,p:$('#tp').value,l:$('#tl').value};const dr=draft;taskSheet(dr.lid,dr.tid);draft=dr;$('#tn').value=f.n;$('#tno').value=f.no;$('#td').value=f.d;$('#tr').value=f.r;$('#tp').value=f.p;$('#tl').value=f.l;$('#subs').innerHTML=subsHTML();document.querySelectorAll('[data-a=rep]').forEach(c=>c.classList.toggle('on',c.dataset.k==dr.rep));$('#dayc').style.display=dr.rep=='days'?'':'none';document.querySelectorAll('[data-a=day]').forEach(c=>c.classList.toggle('on',dr.days.includes(+c.dataset.i)))}
document.addEventListener('submit',e=>{if(e.target.id!='addf')return;e.preventDefault();const i=$('#addin'),v=i.value.trim();if(!v){toast('Type a task first');return}L(ui.lid).tasks.push(nt(v));save();const m=$('#main');render();m.scrollTop=m.scrollHeight;$('#addin').focus()});
document.addEventListener('change',e=>{if(e.target.id=='imp'){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.lists))throw 0;S={theme:'auto',...d};save();ui={v:'home',lid:null,f:'all'};render();toast('Backup restored')}catch(x){toast('That file isn\'t a valid backup')}};r.readAsText(f)}});
/* drag & drop reorder */
let dg=null;
document.addEventListener('dragstart',e=>{const t=e.target.closest('.task');if(!t)return;dg=t;t.classList.add('drag');e.dataTransfer.effectAllowed='move'});
document.addEventListener('dragover',e=>{if(dg)e.preventDefault()});
document.addEventListener('drop',e=>{const t=e.target.closest('.task');if(!dg||!t||t==dg)return;e.preventDefault();const l=L(dg.dataset.lid),a=l.tasks.findIndex(x=>x.id==dg.dataset.tid),b=l.tasks.findIndex(x=>x.id==t.dataset.tid);const[m]=l.tasks.splice(a,1);l.tasks.splice(b,0,m);save();dg=null;render()});
document.addEventListener('dragend',()=>{dg=null;document.querySelectorAll('.drag').forEach(x=>x.classList.remove('drag'))});
/* reminders while open */
setInterval(()=>{const n=new Date(),hm=pad(n.getHours())+':'+pad(n.getMinutes());if(n.getSeconds()>5)return;allT().forEach(({t})=>{if(t.rem==hm&&!t.done&&(!t.due||t.due==today()||t.rep!='none'))toast('⏰ '+t.t)})},1000);
load();rollover();render();
document.addEventListener('visibilitychange',()=>{if(!document.hidden){rollover();render()}});
</script></body></html>
